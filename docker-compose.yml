services:
  db:
    image: postgres:16-alpine
    container_name: regista-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: regista
      POSTGRES_PASSWORD: regista
      POSTGRES_DB: regista
    ports:
      - "5432:5432"
    volumes:
      - regista_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regista -d regista"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  regista_pg:
