# Render Blueprint for Thingstead.
#
# Provision Postgres separately (Neon free is permanent; Render's own Postgres is
# fine too but its free tier expires) and paste its connection string as
# DATABASE_URL in the dashboard. Values marked `sync: false` are entered there;
# AUTH_SECRET is generated for you.
services:
  - type: web
    name: thingstead
    runtime: node
    plan: free # sleeps after ~15 min idle; upgrade when you have steady traffic
    # Match the database's region to keep query latency low. The Neon DB is in
    # ap-southeast-1, so the app runs in Render's Singapore region.
    region: singapore
    branch: master
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm prisma generate && pnpm build
    # Apply any pending migrations, then start. Idempotent — a no-op once current.
    startCommand: pnpm prisma migrate deploy && pnpm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      # A long random secret, generated by Render — never shown or committed.
      - key: AUTH_SECRET
        generateValue: true
      # Postgres connection string (Neon or Render Postgres).
      - key: DATABASE_URL
        sync: false
      # e.g. thingstead.pro in production; your onrender.com host for a first test.
      - key: NEXT_PUBLIC_ROOT_DOMAIN
        sync: false
      # From Resend, once a sending domain is verified. Until then, emails are
      # skipped (signup still works; the verification link just isn't sent).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: Thingstead <no-reply@thingstead.pro>
      # Render puts one proxy in front of the app, so the real client IP is one
      # entry in from the right of X-Forwarded-For. Keep this accurate or rate
      # limiting reads the wrong address.
      - key: TRUSTED_PROXY_COUNT
        value: "1"
